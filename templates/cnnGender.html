<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CNN Gender Classification</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #FAFAFA; color: #111111; margin: 0; padding: 60px 20px; }
      .container { max-width: 600px; margin: 0 auto; }
      .back-link { text-decoration: none; color: #111111; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; display: inline-block; margin-bottom: 40px; }
      .back-link:hover { color: #FF5A36; }
      h2 { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin: 0 0 10px 0; }
      p { margin: 0 0 30px 0; opacity: 0.7; }
      form { display: flex; flex-direction: column; gap: 25px; border-top: 3px solid #111111; padding-top: 30px; }
      .group { display: flex; flex-direction: column; gap: 8px; }
      label { text-transform: uppercase; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.5px; }
      input[type="file"] { border: 3px solid #111111; padding: 25px; font-size: 1rem; background: #FAFAFA; font-family: inherit; font-weight: bold; }
      button { background: #111111; color: #FAFAFA; border: none; padding: 16px; font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
      button:hover { background: #FF5A36; }
      .result-card { margin-top: 40px; border: 3px solid #111111; background: #FAFAFA; padding: 30px; position: relative; }
      .result-card h3 { margin: 0 0 10px 0; font-size: 2rem; font-weight: 900; text-transform: uppercase; }
      .result-card h3 span { color: #FF5A36; }
      .result-card p { margin: 0; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; opacity: 0.6; }
      .error-box { border: 3px solid #111111; color: #FF5A36; padding: 20px; margin-top: 30px; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="/" class="back-link">← Dashboard</a>
      <h2>CNN Image Inference</h2>
      <p>Convolutional neural pipeline specialized for real-time demographic classification.</p>

      <form action="/cnnGender" method="POST" enctype="multipart/form-data">
        <div class="group">
          <label>Target Image Matrix</label>
          <input type="file" name="image" accept="image/*" required />
        </div>
        <button type="submit">Execute Inference</button>
      </form>

      {% if label %}
      <div class="result-card">
        <h3>Class // <span>{{ label }}</span></h3>
        <p>Mathematical Confidence // {{ confidence }}</p>
      </div>
      {% endif %}

      {% if error %}
      <div class="error-box">Error // {{ error }}</div>
      {% endif %}
    </div>
  
<script>
document.addEventListener("DOMContentLoaded", function() {
    var form = document.querySelector("form");
    if (form) {
        form.addEventListener("submit", function() {
            var btn = form.querySelector("button[type='submit']") || form.querySelector("input[type='submit']") || form.querySelector(".btn");
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = "Processing (Model Loading in Background)...";
                btn.value = "Processing (Model Loading)...";
                btn.style.opacity = "0.7";
                btn.style.cursor = "wait";
            }
        });
    }
});
</script>
</body>

</html>
