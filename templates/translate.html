<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>English to Urdu Translation</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #FAFAFA; color: #111111; margin: 0; padding: 60px 20px; }
      .container { max-width: 650px; margin: 0 auto; }
      .back-link { text-decoration: none; color: #111111; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; display: inline-block; margin-bottom: 40px; }
      .back-link:hover { color: #FF5A36; }
      h2 { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin: 0 0 10px 0; }
      p { margin: 0 0 30px 0; opacity: 0.7; }
      form { display: flex; flex-direction: column; gap: 20px; border-top: 3px solid #111111; padding-top: 30px; }
      textarea { border: 3px solid #111111; padding: 15px; font-size: 1.1rem; background: #FAFAFA; font-family: inherit; resize: vertical; min-height: 100px; outline: none; }
      textarea:focus { border-color: #FF5A36; }
      button { background: #111111; color: #FAFAFA; border: none; padding: 16px; font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; width: fit-content; }
      button:hover { background: #FF5A36; }
      .translation-output { margin-top: 40px; border: 3px solid #111111; background: #FAFAFA; padding: 30px; }
      .translation-output h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px 0; opacity: 0.5; }
      .translation-output .input-source { font-size: 1.1rem; font-weight: bold; margin-bottom: 35px; }
      .translation-output .urdu-target { font-size: 2.4rem; line-height: 1.6; font-family: 'Jameel Noori Nastaleeq', 'Urdu Typesetting', sans-serif; color: #FF5A36; text-align: right; padding-top: 10px; border-top: 2px dashed #111111; }
      .error-box { border: 3px solid #111111; color: #FF5A36; padding: 20px; margin-top: 30px; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="/" class="back-link">← Dashboard</a>
      <h2>MarianMT Translation Script</h2>
      <p>Direct semantic mapping from English source tokens into structural Urdu glyph variants.</p>

      <form action="/translate" method="POST">
        <textarea name="english_text" placeholder="Type script parameters to transform..." required></textarea>
        <button type="submit">Translate Array</button>
      </form>

      {% if english_text %}
      <div class="translation-output">
        <h3>Source Text (EN)</h3>
        <div class="input-source">"{{ english_text }}"</div>

        <h3>Target Matrix (UR)</h3>
        <div class="urdu-target" dir="rtl">{{ urdu_text }}</div>
      </div>
      {% endif %}

      {% if error %}
      <div class="error-box">Error // {{ error }}</div>
      {% endif %}
    </div>
  
<script>
document.addEventListener("DOMContentLoaded", function() {
    var form = document.querySelector("form");
    if (form) {
        form.addEventListener("submit", function() {
            var btn = form.querySelector("button[type='submit']") || form.querySelector("input[type='submit']") || form.querySelector(".btn");
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = "Processing (Model Loading in Background)...";
                btn.value = "Processing (Model Loading)...";
                btn.style.opacity = "0.7";
                btn.style.cursor = "wait";
            }
        });
    }
});
</script>
</body>

</html>
